# PACCHETTO ITALIANO - impostazioni generali di DisplayMonitor.
# Copia questo file in config/config.yaml (oppure: python -m displaymonitor --init it); config/config.yaml e' tuo e non finisce su Git.
# Se config/config.yaml non esiste si usa l'esempio inglese (config.example.yaml).

language: it           # lingua dei menu della tray (it | en)
date_language: it      # giorno e mese nella data: "sab 03 dic" (it) oppure "Sat 03 Dec" (en)
temperature_unit: celsius   # celsius | fahrenheit : tutte le temperature sul display (soglie e colori restano in °C)

layout:
  header: false        # false = compatto: niente barra in alto, anello piu' grande, schede piu' alte, orologio grande in alto a sinistra,
                       #         loghi agli angoli bassi dell'anello. true = barra in alto con titolo pagina, data/ora e loghi.
  logo_h: 22           # altezza dei loghi in px
  # clock: true        # layout compatto: ora grande + data in alto a sinistra
  # ring_scale: 1.15   # layout compatto: dimensione dell'anello

display:
  rotate: 1            # rotazione SOFTWARE del frame (np.rot90): 1 oppure 3 a seconda di come e' montato lo schermo.
                       # Il pannello resta sempre in portrait: la rotazione hardware del firmware e' inaffidabile.
  brightness: 100      # retroilluminazione in %, 0-100 (100 = massima); applicata ad ogni avvio
  max_block_px: 12800  # ogni comando bitmap resta sotto questo numero di pixel (limite DMA del firmware)
  flood_bytes: 2200000 # dopo una chiusura brusca/errore link: flusso di zeri che completa il bitmap rimasto a meta' (~13 s)
  reset_on_connect: false  # il comando RESET non ha effetto visibile su questo schermo
  refresh_band: 8      # righe ritrasmesse a ogni frame a rotazione: guarisce i pixel corrotti (0 = disattivato)
  tile: 2              # granularita' (px) del rilevamento differenze
  merge_gap: 4         # unisce rettangoli separati da meno di N px

refresh_s: 1.0         # ogni quanto si ridisegna e si inviano le differenze
hot_reload: true       # rilegge config.yaml / pages.yaml / temi quando cambiano e li applica senza riavvio
home_page: overview    # pagina di riepilogo, sempre visibile
stay_on_selected: true # una pagina scelta dalla tray resta fissa finche' non si sceglie "Torna al riepilogo".
                       # Ad ogni avvio si riparte sempre dal riepilogo (la scelta non viene salvata).
peek_s: 30             # usato solo se stay_on_selected e' false: secondi prima di tornare al riepilogo
rotate_s: 0            # 0 = nessuna rotazione automatica; N = secondi per pagina (attivabile anche dalla tray)

theme:
  # preset: nebula       # un look salvato in themes/NOME.yaml (inclusi) o config/themes/NOME.yaml (tuoi): default | nebula | grid | ember | sunset | aurora
  # logos: [intel, asus] # nomi dalla libreria di loghi (assets/logos/ + logos/) o percorsi; cambiabili anche dalla tray
  # background: assets/backgrounds/miaimmagine.jpg   # sfondo opzionale; vedi docs/THEMING.md
  # Qualsiasi colore si puo' ridefinire qui, es.:  cyan: "#ff66cc"
  # Soglie dei colori, uguali per temperature (°C) e utilizzo (%):
  #   [bianco_sotto, verde_fino_a, rosso_a]  ->  testo bianco sotto la 1a soglia, verde fino alla 2a,
  #   poi giallo -> arancione -> rosso che raggiunge il rosso pieno alla 3a. Le barre usano lo stesso schema.
  scale: [50, 60, 100]

network:
  interface: auto      # oppure il nome esatto, es. "Ethernet"
  ping_host: 1.1.1.1

sensors:
  fast_s: 1.0
  storage_s: 10
  procs_s: 3
  ping_s: 5
  ram_temp: false      # temperatura dei moduli RAM dai sensori SPD dei DIMM (serve PawnIO; puo' dare conflitti con iCUE / Armoury)
  # cpu_power_max: 150  # watt of a full power bar on the CPU page (it grows by itself if the CPU draws more)
  mb_ignore_temps: []  # sonde della scheda madre scollegate/inaffidabili, es. [5] nasconde "Temperature #5"

# Meteo opzionale (Open-Meteo: gratuito, senza account ne' chiave). L'unica richiesta e' un GET ad api.open-meteo.com con le tue coordinate.
# weather:
#   enabled: true
#   latitude: 43.7
#   longitude: 13.2
#   city: "La mia citta'"  # solo un'etichetta: {weather_city}
#   refresh_min: 30

# Orario notturno: tra i due orari la retroilluminazione si abbassa (mode: dim) o lo schermo diventa nero (mode: off).
night:
  enabled: false
  from: "23:00"
  to: "07:00"           # puo' essere prima di `from`: la finestra attraversa la mezzanotte
  mode: dim             # dim | off
  brightness: 10        # % di retroilluminazione mentre e' abbassata

# Schermo bloccato / PC in sospensione / spegnimento / disconnessione: il display mostra questa parola sullo sfondo del tema.
away:
  enabled: true
  text: "Ciao"
  subtitle: true        # una riga piccola sotto: "schermo bloccato", "sospensione", "spegnimento"

# Sfondo rosso: quando le temperature o l'utilizzo di CPU / GPU / RAM salgono, lo sfondo dello schermo vira al rosso.
# Cambiano solo i colori dello sfondo (nulla si sposta), a `steps` livelli e con un po' di inerzia, perche' ogni cambio ridisegna lo schermo.
alerts:
  tint:
    enabled: true
    temp: [75, 95]      # °C (cpu, gpu, ram): nessun rosso al primo valore, rosso pieno al secondo
    load: [85, 100]     # % di utilizzo (cpu, gpu, ram)
    strength: 0.5       # quanto diventa rosso al massimo (0..1)
    steps: 6
  # Le regole piu' vecchie: mostra una pagina per hold_s secondi finche' una condizione e' vera (chiavi: python -m displaymonitor --dump-sensors)
  pages: []
  #  - {page: memory, when: "mem_pct is not None and mem_pct >= 92", hold_s: 30}

# Anteprima web locale dello schermo, con i pulsanti delle pagine (attivabile anche dalla tray). Raggiungibile solo da questo PC.
# Per altri dispositivi imposta host: 0.0.0.0 E un token, poi apri http://<questo-pc>:8765/?t=<token>
web:
  enabled: false
  host: 127.0.0.1
  port: 8765
  token: ""

# Controlla sul repository GitHub se esiste una versione piu' nuova (una sola GET, non viene inviato nulla). `python -m displaymonitor --update` la installa.
updates:
  check: true
  interval_h: 24
