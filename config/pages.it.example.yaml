# PACCHETTO ITALIANO - pagine. Copia questo file in config/pages.yaml (oppure: python -m displaymonitor --init it).
# Pagine. Schema comune: anello a sinistra (ring) + schede a destra (cards).
# Testi: {chiave:formato}, es. "{cpu_temp:.0f}°C". Valori mancanti -> "--".
# Colori: spec = "testo"  oppure  {text, value, warn, crit, color}  (warn -> ambra, crit -> magenta).
# Schede: kind = main | stats | list | spark.   h = altezza in px (totale schede + 8 px tra l'una e l'altra <= 246).

pages:

  # ------------------------------------------------------------------------------------------
  - id: overview
    title: PANORAMICA
    ring:
      segments: cpu_threads      # un quadrato per thread: colore e luminosita' seguono il carico di quel thread
      seg_max: 100
      seg_color: heat
      legend:                    # in alto a sinistra, fuori dall'anello. line:N = N-esimo anello sottile dall'esterno
        - {icon: square, text: "Core"}
        - {icon: dash, text: "% CPU"}      # i tre anelli sottili, dall'esterno all'interno: % CPU, °C CPU, % RAM
        - {icon: dash, text: "CPU °C"}
        - {icon: dash, text: "% RAM"}
      arcs:
        # dall'esterno all'interno: carico CPU, temperatura CPU, RAM occupata. Colore = livello (azzurro..rosso).
        - {value: cpu_load, min: 0, max: 100, color: heat, radius: 77, width: 5}
        - {value: cpu_temp, min: 30, max: 95, color: heat, radius: 69, width: 5}
        - {value: mem_pct, min: 0, max: 100, color: heat, radius: 61, width: 5}
      center:
        label: CPU
        big: {text: "{cpu_load:.0f}%", value: cpu_load}
        line1: {text: "{cpu_temp:.0f}°C", value: cpu_temp, warn: 75, crit: 90}
        line2: "{cpu_power:.0f} W · {cpu_clock:.2f} GHz"
    cards:
      - kind: main
        h: 78
        title: "GPU · {gpu_short}"
        big: {text: "{gpu_load:.0f}%", value: gpu_load, warn: 90, crit: 99}
        mid: {text: "{gpu_temp:.0f}°C", value: gpu_temp, warn: 75, crit: 85}
        right: ["{gpu_power:.0f} W", "{gpu_vram_used:.1f} / {gpu_vram_total:.0f} GB"]
        bar: {value: gpu_load, max: 100, color: heat}
      - kind: main
        h: 66
        title: RAM
        big: {text: "{mem_pct:.0f}%", value: mem_pct, warn: 85, crit: 95}
        mid: {text: "{ram_temp:.0f}°C", value: ram_temp}
        right: ["{mem_used:.1f} / {mem_total:.0f} GB"]
        bar: {value: mem_pct, max: 100, color: heat}
      - kind: stats
        h: 82
        title: DISCHI · SCHEDA · RETE
        items:
          - {label: NVMe, text: "{disk_max_nvme:.0f}°C", value: disk_max_nvme, warn: 60, crit: 70}
          - {label: SSD, text: "{disk_max_ssd:.0f}°C", value: disk_max_ssd, warn: 55, crit: 65}
          - {label: HDD, text: "{disk_max_hdd:.0f}°C", value: disk_max_hdd, warn: 45, crit: 55}
          - {label: Scheda, text: "{mb_t_max:.0f}°C", value: mb_t_max, warn: 60, crit: 75}
        footer:
          left: {text: "{net_down_str}", marker: down}
          right: {text: "{net_up_str}", marker: up}

  # ------------------------------------------------------------------------------------------
  - id: cpu
    title: CPU
    ring:
      segments: cpu_threads      # un quadrato per thread: colore e luminosita' seguono il carico di quel thread
      seg_max: 100
      seg_color: heat
      legend:                    # in alto a sinistra, fuori dall'anello. line:N = N-esimo anello sottile dall'esterno
        - {icon: square, text: "Core"}
        - {icon: dash, text: "% CPU"}      # i tre anelli sottili, dall'esterno all'interno: % CPU, °C CPU, % RAM
        - {icon: dash, text: "CPU °C"}
        - {icon: dash, text: "% RAM"}
      arcs:
        # dall'esterno all'interno: carico CPU, temperatura CPU, RAM occupata. Colore = livello (azzurro..rosso).
        - {value: cpu_load, min: 0, max: 100, color: heat, radius: 77, width: 5}
        - {value: cpu_temp, min: 30, max: 95, color: heat, radius: 69, width: 5}
        - {value: mem_pct, min: 0, max: 100, color: heat, radius: 61, width: 5}
      center:
        label: "{cpu_name}"
        big: {text: "{cpu_load:.0f}%", value: cpu_load}
        line1: {text: "{cpu_temp:.0f}°C", value: cpu_temp, warn: 75, crit: 90}
        line2: "{cpu_power:.0f} W"
    cards:
      - kind: main
        h: 78
        title: TEMPERATURA PACKAGE
        big: {text: "{cpu_temp:.0f}°C", value: cpu_temp, warn: 75, crit: 90}
        mid: {text: "max {cpu_temp_max:.0f}°C", value: cpu_temp_max}
        right:
          - {text: "P {cpu_p_temp:.0f}°C", value: cpu_p_temp}
          - {text: "E {cpu_e_temp:.0f}°C", value: cpu_e_temp}
        bar: {value: cpu_temp, min: 30, max: 100, color: heat}
      - kind: main
        h: 66
        title: POTENZA PACKAGE
        big: "{cpu_power:.0f} W"
        right:
          - "picco {cpu_power_peak:.0f} W"
          - "P {cpu_clock:.2f} · E {cpu_clock_e:.2f} GHz"
        bar: {value: cpu_power, min: 0, max: cpu_power_scale, color: spectrum}
      - kind: list
        h: 82
        title: TEMPERATURE CORE (°C)
        row_h: 24
        rows:
          - {label: "P-core", text: "{cpu_p_temps_str}", value: cpu_p_temp}
          - {label: "E-core", text: "{cpu_e_temps_str}", value: cpu_e_temp}

  # ------------------------------------------------------------------------------------------
  - id: gpu
    title: GPU
    # logos: [geforce, gigabyte]   # opzionale: i due loghi di questa pagina (nomi della libreria); le altre pagine usano theme.logos
    ring:
      arcs:
        - {value: gpu_load, min: 0, max: 100, color: heat, radius: 90, width: 11}
        - {value: gpu_vram_pct, min: 0, max: 100, color: heat, radius: 76, width: 8}
        - {value: gpu_temp, min: 30, max: 100, color: heat, radius: 65, width: 5}
      center:
        label: "{gpu_short}"
        big: {text: "{gpu_load:.0f}%", value: gpu_load}
        line1: {text: "{gpu_temp:.0f}°C", value: gpu_temp, warn: 75, crit: 85}
        line2: "{gpu_power:.0f} W"
    cards:
      - kind: main
        h: 78
        title: TEMPERATURA
        big: {text: "{gpu_temp:.0f}°C", value: gpu_temp, warn: 75, crit: 85}
        mid: {text: "HS {gpu_hotspot:.0f}°C", value: gpu_hotspot}
        right: ["fan {gpu_fan_pct:.0f}%"]
        bar: {value: gpu_temp, min: 30, max: 100, color: heat}
      - kind: main
        h: 66
        title: VRAM
        big: {text: "{gpu_vram_pct:.0f}%", value: gpu_vram_pct, warn: 85, crit: 95}
        right: ["{gpu_vram_used:.1f} / {gpu_vram_total:.0f} GB"]
        bar: {value: gpu_vram_pct, max: 100, color: heat}
      - kind: stats
        h: 66
        title: CLOCK · POTENZA
        items:
          - {label: Core, text: "{gpu_clock:.0f} MHz"}
          - {label: Memoria, text: "{gpu_mem_clock:.0f} MHz"}
          - {label: Potenza, text: "{gpu_power:.0f} W"}

  # ------------------------------------------------------------------------------------------
  # Le temperature della scheda madre non hanno un nome ufficiale: T1..T6 sono i sensori del Super I/O
  # (T5 e' una sonda scollegata, non viene mostrata). Rinominali qui sotto dopo averli confrontati col BIOS.
  - id: motherboard
    title: SCHEDA MADRE
    ring:
      segments: mb_fan_duties
      seg_max: 100
      arcs:
        - {value: mb_t_max, min: 30, max: 100, color: heat, radius: 72, width: 5}
      center:
        label: "{mb_name}"
        big: {text: "{mb_t_max:.0f}°C", value: mb_t_max, warn: 60, crit: 75}
        line1: "Vcore {mb_vcore:.3f} V"
        line2: "{mb_fan_count} ventole attive"
    cards:
      - kind: stats
        h: 66
        title: TEMPERATURE
        items:
          - {label: "T1", text: "{mb_t1:.0f}°C", value: mb_t1, warn: 60, crit: 75}
          - {label: "T2", text: "{mb_t2:.0f}°C", value: mb_t2, warn: 60, crit: 75}
          - {label: "T4", text: "{mb_t4:.0f}°C", value: mb_t4, warn: 60, crit: 75}
          - {label: "T6", text: "{mb_t6:.0f}°C", value: mb_t6, warn: 60, crit: 75}
      - kind: list
        h: 92
        title: VENTOLE
        rows_from: mb_fans
        slice: [0, 3]
        row_h: 21
        row:
          label: "{name}"
          text: "{rpm:.0f} rpm"
          bar: {value: pct, max: 100}
      - kind: stats
        h: 66
        title: TENSIONI
        items:
          - {label: Vcore, text: "{mb_vcore:.2f} V"}
          - {label: "+3.3V", text: "{mb_v33:.2f} V"}
          - {label: "3V SB", text: "{mb_v3sb:.2f} V"}
          - {label: CMOS, text: "{mb_vbat:.2f} V"}

  # ------------------------------------------------------------------------------------------
  - id: disks
    title: DISCHI
    ring:
      segments: disk_temps
      seg_max: 70
      seg_sat: 0.9
      seg_warn: 55
      seg_crit: 70
      center:
        label: DISCHI
        big: {text: "{disk_temp_max:.0f}°C", value: disk_temp_max, warn: 55, crit: 70}
        line1: "{disk_count} unità"
        line2: "R {disk_read_mbs:.1f} · W {disk_write_mbs:.1f} MB/s"
    cards:
      - kind: list
        h: 78
        title: UNITÀ 1 - 2
        rows_from: disks
        slice: [0, 2]
        row_h: 24
        row:
          label: "{short}"
          text: "{temp:.0f}°C{used_str}"
          value: temp
          warn: 55
          crit: 70
          bar: {value: used_pct, max: 100, color: heat}
      - kind: list
        h: 78
        title: UNITÀ 3 - 4
        rows_from: disks
        slice: [2, 4]
        row_h: 24
        row:
          label: "{short}"
          text: "{temp:.0f}°C{used_str}"
          value: temp
          warn: 55
          crit: 70
          bar: {value: used_pct, max: 100, color: heat}
      - kind: list
        h: 78
        title: UNITÀ 5 - 6
        rows_from: disks
        slice: [4, 6]
        row_h: 24
        row:
          label: "{short}"
          text: "{temp:.0f}°C{used_str}"
          value: temp
          warn: 55
          crit: 70
          bar: {value: used_pct, max: 100, color: heat}

  # ------------------------------------------------------------------------------------------
  - id: memory
    title: MEMORIA
    ring:
      arcs:
        - {value: mem_pct, min: 0, max: 100, color: heat, radius: 90, width: 11}
        - {value: vmem_pct, min: 0, max: 100, color: heat, radius: 76, width: 8}
      center:
        label: RAM
        big: {text: "{mem_pct:.0f}%", value: mem_pct, warn: 85, crit: 95}
        line1: "{mem_used:.1f} GB"
        line2: "di {mem_total:.0f} GB"
    cards:
      - kind: main
        h: 66
        title: RAM FISICA
        big: {text: "{mem_pct:.0f}%", value: mem_pct, warn: 85, crit: 95}
        mid: {text: "{ram_temp:.0f}°C", value: ram_temp}
        right: ["{mem_used:.1f} / {mem_total:.0f} GB"]
        bar: {value: mem_pct, max: 100, color: heat}
      - kind: main
        h: 66
        title: FILE DI PAGING
        big: {text: "{vmem_pct:.0f}%", value: vmem_pct, warn: 85, crit: 95}
        right: ["{vmem_used:.1f} / {vmem_total:.0f} GB"]
        bar: {value: vmem_pct, max: 100, color: heat}
      - kind: list
        h: 90
        title: PROCESSI PIÙ PESANTI
        rows_from: proc_mem
        slice: [0, 3]
        row_h: 21
        row:
          label: "{name}"
          text: "{mem_gb:.1f} GB"
          bar: {value: mem_pct, max: 25}

  # ------------------------------------------------------------------------------------------
  - id: network
    title: RETE
    ring:
      arcs:
        - {value: net_down_pct, min: 0, max: 100, color: cyan, radius: 90, width: 11}
        - {value: net_up_pct, min: 0, max: 100, color: magenta, radius: 76, width: 8}
      center:
        label: DOWNLOAD
        big: "{net_down_val}"
        line1: "{net_down_unit}"
        line2: "UP {net_up_str}"
    cards:
      - kind: spark
        h: 78
        title: DOWNLOAD
        big: "{net_down_str}"
        history: net_down_hist
        color: cyan
      - kind: spark
        h: 78
        title: UPLOAD
        big: "{net_up_str}"
        history: net_up_hist
        color: magenta
      - kind: stats
        h: 66
        title: CONNESSIONE
        items:
          - {label: IP, text: "{net_ip}"}
          - {label: Ping, text: "{ping_ms:.0f} ms", value: ping_ms, warn: 60, crit: 150}
          - {label: Link, text: "{net_speed}"}

  # ------------------------------------------------------------------------------------------
  - id: system
    title: SISTEMA
    ring:
      segments: clock_seconds
      seg_max: 100
      center:
        label: "{date}"
        big: "{time}"
        big_px: 32
        line1: "{time_s}"
        line2: "uptime {uptime_str}"
    cards:
      - kind: list
        h: 104
        title: PROCESSI PIÙ ATTIVI (CPU)
        rows_from: proc_cpu
        slice: [0, 4]
        row_h: 21
        row:
          label: "{name}"
          text: "{cpu:.1f}%"
          bar: {value: cpu, max: 30}
      - kind: main
        h: 62
        title: UPTIME
        big: "{uptime_str}"
        right: ["{sys_procs} processi"]
      - kind: stats
        h: 56
        title: CARICO
        items:
          - {label: CPU, text: "{cpu_load:.0f}%", value: cpu_load, warn: 85, crit: 95}
          - {label: GPU, text: "{gpu_load:.0f}%", value: gpu_load, warn: 90, crit: 99}
          - {label: RAM, text: "{mem_pct:.0f}%", value: mem_pct, warn: 85, crit: 95}

  # ------------------------------------------------------------------------------------------
  # Meteo (Open-Meteo). Nascosta finche' in config.yaml non c'e' `weather: {enabled: true, latitude, longitude}`.
  - id: weather
    title: METEO
    requires: weather
    ring:
      arcs:
        - {value: weather_humidity, min: 0, max: 100, color: cyan, radius: 90, width: 11}
      center:
        label: "{weather_city}"
        big: "{weather_temp:.0f}°"
        line1: "{weather_desc}"
        line2: "percepita {weather_feels:.0f}°"
    cards:
      - kind: main
        h: 78
        title: TEMPERATURA
        big: "{weather_temp:.1f}°C"
        mid: "perc. {weather_feels:.0f}°C"
        bar: {value: weather_temp, min: -10, max: 40, color: cyan}
      - kind: main
        h: 66
        title: UMIDITÀ
        big: "{weather_humidity:.0f}%"
        bar: {value: weather_humidity, max: 100, color: cyan}
      - kind: stats
        h: 66
        title: VENTO
        items:
          - {label: Velocità, text: "{weather_wind:.0f} km/h"}
          - {label: Aggiornato, text: "{weather_age_min:.0f} min fa"}
