# DisplayMonitor - general settings.
# Copy this file to config/config.yaml and edit it; config/config.yaml is git-ignored (your own settings).
# If config/config.yaml does not exist, this example is used.

language: en           # language of the tray menu (en | it)
# date_language: en    # language of the day / month names in the date, e.g. "Sat 03 Dec" (en) or "sab 03 dic" (it); defaults to `language`
temperature_unit: celsius   # celsius | fahrenheit : every temperature on the display (limits and colours stay in °C)

layout:
  header: false        # false = compact: no top bar, bigger ring, taller cards, big clock top-left, logos at the ring's lower corners.
                       # true = top bar with the page title, date/time and (optional) logos.
  logo_h: 22           # logo height in px
  # clock: true        # compact layout only: big time + date at the top-left of the ring
  # ring_scale: 1.15   # compact layout only: size of the ring relative to the default

display:
  rotate: 1           # SOFTWARE rotation of the frame (np.rot90 steps): 1 or 3, depending on how the screen is mounted.
                       # The panel itself is always kept in portrait: the firmware's own rotation is unreliable.
  max_block_px: 12800  # every bitmap command stays below this many pixels (the firmware's DMA limit)
  flood_bytes: 2200000 # after an abnormal exit / link error: zero bytes that complete a half-sent bitmap (~13 s)
  reset_on_connect: false  # the RESET command has no visible effect on the tested unit
  refresh_band: 8      # rows resent on every frame, cycling over the screen: heals corrupted pixels (0 = off)
  brightness: 100      # backlight in percent, 0-100 (100 = brightest); applied at every start
  tile: 2              # granularity (px) of the change detection
  merge_gap: 4         # merge changed rectangles closer than this many px

refresh_s: 1.0         # how often the frame is redrawn and the differences are sent
home_page: overview    # the recap page, always shown
stay_on_selected: true # a page picked from the tray stays until you choose "Back to recap".
                       # Every start begins on the recap page (the choice is never saved).
peek_s: 30             # only used when stay_on_selected is false: seconds before going back to the recap
rotate_s: 0            # 0 = no automatic rotation; N = seconds per page (can also be toggled from the tray)

theme:
  # preset: nebula       # a look saved as themes/NAME.yaml (shipped) or config/themes/NAME.yaml (yours): default | nebula | grid | ember | sunset | aurora
  # logos: [intel, rog]    # names from the logo library assets/logos/ (or paths); also switchable from the tray. No logos are shipped: tools/import_logo.py
  # background: assets/backgrounds/mypicture.jpg # optional background picture; see docs/THEMING.md for dim / blur / panel_opacity ...
  # Any colour can be overridden here too, e.g.:  cyan: "#ff66cc"
  # Colour thresholds, the same for temperatures (°C) and utilisation (%):
  #   [white_below, green_until, red_at]  ->  text is white below the 1st value, green up to the 2nd,
  #   then yellow -> orange -> red, reaching full red at the 3rd. Bars use the same scheme.
  scale: [50, 60, 100]

network:
  interface: auto      # or an exact adapter name, e.g. "Ethernet"
  ping_host: 1.1.1.1

sensors:
  fast_s: 1.0
  storage_s: 10
  procs_s: 3
  ping_s: 5
  ram_temp: false      # RAM module temperatures from the DIMMs' SPD sensors (needs PawnIO; can clash with iCUE / Armoury). Keys: ram_temp, ram_temps_str
  # cpu_power_max: 150  # watt of a full power bar on the CPU page (it grows by itself if the CPU draws more)
  mb_ignore_temps: []  # motherboard probes that read garbage (unconnected), e.g. [5] hides "Temperature #5"

# Optional weather page (Open-Meteo: free, no account / key). The only request is a GET to api.open-meteo.com with your coordinates.
# weather:
#   enabled: true
#   latitude: 43.7
#   longitude: 13.2
#   city: "My town"        # a label for your pages: {weather_city}
#   refresh_min: 30

# Night schedule: between the two times the backlight is dimmed (mode: dim) or the screen goes black (mode: off).
night:
  enabled: false
  from: "23:00"
  to: "07:00"           # may be earlier than `from`: the window then wraps over midnight
  mode: dim             # dim | off
  brightness: 10        # backlight % while dimmed

# Screen locked / PC going to sleep / shutting down / signing out: the display shows this word on the theme's background.
away:
  enabled: true
  text: "Bye"
  subtitle: true        # a small line under it: "screen locked", "sleeping", "shutting down"

# Red background: as the CPU / GPU / RAM temperatures or utilisation climb, the background of the screen turns red.
# Only its colours change (nothing moves), and it comes in `steps` quantised levels, smoothed, because every change redraws the screen.
alerts:
  tint:
    enabled: true
    temp: [75, 95]      # °C (cpu, gpu, ram): no red at the first value, full red at the second
    load: [85, 100]     # % utilisation (cpu, gpu, ram)
    strength: 0.5       # how red it gets at full (0..1)
    steps: 6
  # The older rules: show a page for hold_s seconds while a condition holds (sensor keys: python -m displaymonitor --dump-sensors)
  pages: []
  #  - {page: memory, when: "mem_pct is not None and mem_pct >= 92", hold_s: 30}

# Local web preview of the screen, with page buttons (also switchable from the tray). Only reachable from this PC.
# For other devices set host: 0.0.0.0 AND a token, then open http://<this-pc>:8765/?t=<token>
web:
  enabled: false
  host: 127.0.0.1
  port: 8765
  token: ""

# Looks at the GitHub repository for a newer version (one GET, nothing is sent). `python -m displaymonitor --update` installs it.
updates:
  check: true
  interval_h: 24
