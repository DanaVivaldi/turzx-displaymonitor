name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the tests need no hardware, no LibreHardwareMonitor and no pythonnet: only the rendering / driver stack
      - run: python -m pip install pyserial Pillow numpy PyYAML psutil pytest
      - run: python -m pytest
